spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Raj@12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HikariCP and DB connection timeout settings
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=45000

server.port=${PORT:8080}

jwt.secret=${JWT_SECRET:this_is_a_very_long_secret_key_for_jwt_which_should_be_at_least_256_bits_long_1234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}



